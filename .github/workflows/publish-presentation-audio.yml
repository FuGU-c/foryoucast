name: Publish presentation audio
on:
  push:
    branches: [main]
    paths: ['.audio-transfer/READY']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Stage presentation audio payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover the verified transfer if needed
        run: |
          if [ ! -f .audio-transfer/manifest.json ]; then
            git fetch --depth=1 origin 965ea221430e34f78e6eb038c259ce770bf4b2be
            git restore --source=965ea221430e34f78e6eb038c259ce770bf4b2be --worktree -- .audio-transfer
          fi
      - name: Restore verified narration files
        run: python3 scripts/restore-presentation-audio.py
      - name: Commit the audio files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation-audio
          git add -f presentation-audio/foryoucast-presentation-voice-pack.zip
          git rm -r -f .audio-transfer
          git commit -m 'Publish presentation audio assets'
          git push
