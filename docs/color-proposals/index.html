<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seranews — four color proposals</title><style>*{box-sizing:border-box}body{margin:0;padding:36px;background:#e9edf2;color:#17263d;font:15px/1.5 system-ui,sans-serif}header{max-width:1120px;margin:auto auto 24px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px}header p{margin:0;color:#4a5c73}.controls{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}button,select{font:inherit;cursor:pointer}select{padding:9px 12px;border:1px solid #7b879b;border-radius:9px;background:white;color:#17263d}.grid{max-width:1120px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:32px}.proposal>h2{font-size:23px;margin:0}.proposal>p{color:#4a5c73;max-width:520px;margin:6px 0 15px;min-height:46px}.demo{background:var(--background);color:var(--text);border:1px solid var(--border-control);border-radius:28px;overflow:hidden;box-shadow:0 12px 32px #1a294812}.top{background:var(--surface);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}.brand{font-family:Georgia,serif;font-size:25px;color:var(--text)}.brand span{color:var(--primary)}.avatar{background:var(--selected);color:var(--on-selected);font-weight:650;border-radius:100%;padding:8px;font-size:12px}.content{padding:23px}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:650;color:var(--text-muted)}.content h3{font-size:29px;letter-spacing:-1px;line-height:1.15;margin:10px 0 7px}.sub{color:var(--text-secondary);font-size:13px}.hero{background:var(--surface-subtle);border:1px solid var(--border);padding:22px;border-radius:19px;margin:20px 0}.hero h4{font-size:24px;letter-spacing:-.5px;line-height:1.25;margin:8px 0 10px}.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}.primary{border:0;background:var(--primary);color:var(--on-primary);padding:12px 17px;border-radius:11px;font-weight:650;margin-top:18px;display:inline-flex;align-items:center;gap:8px}.primary:hover{background:var(--primary-hover)}.primary:active{background:var(--primary-active)}button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.section-label{display:flex;justify-content:space-between;align-items:center;margin:20px 0 11px;font-weight:650}.text-link{color:var(--primary);font-size:12px}.article{background:var(--surface);padding:16px;border:1px solid var(--border);border-radius:15px;display:grid;grid-template-columns:44px 1fr;gap:12px}.art{width:44px;height:50px;background:var(--selected);color:var(--on-selected);display:grid;place-items:center;border-radius:9px;font-family:Georgia,serif;font-size:22px}.article h5{font-size:15px;line-height:1.4;margin:3px 0 7px}.source{font-size:11px;color:var(--text-muted)}.tag{background:var(--selected);color:var(--on-selected);font-size:10px;padding:4px 8px;border-radius:6px}.prefs{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px}.prefs b{font-weight:550}.prefs small{display:block;color:var(--text-muted);font-size:11px;margin-top:3px}.switch{background:var(--primary);width:35px;height:21px;border-radius:12px;display:flex;justify-content:flex-end;padding:3px}.switch:after{content:'';display:block;background:var(--on-primary);width:15px;height:15px;border-radius:100%}.player{background:var(--surface);border-top:1px solid var(--border);padding:15px 23px}.player-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650}.player-top small{color:var(--text-muted);font-weight:400}.wave{display:flex;height:31px;gap:3px;align-items:center;margin:9px 0 3px}.wave i{display:block;width:3px;border-radius:3px;background:var(--border)}.wave i.played{background:var(--accent)}.clock{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted)}.nav{display:flex;justify-content:space-around;background:var(--surface);border-top:1 C5", "primary-hover": "#1D47A4", "primary-active": "#183C8D", "secondary": "#215E68", "accent": "#A3442F", "background": "#F3F6FB", "surface": "#FFFFFF", "surface-subtle": "#EAF0F8", "text": "#17263D", "text-secondary": "#435570", "text-muted": "#586B85", "border": "#D8E1ED", "border-control": "#71839E", "selected": "#E5EDFF", "on-selected": "#173F99", "focus": "#2457C5", "disabled": "#E1E6EE", "on-disabled": "#647187", "success": "#14623F", "success-surface": "#E6F4EB", "warning": "#805200", "warning-surface": "#FFF2CE", "error": "#AA2D34", "error-surface": "#FDECEF", "on-primary": "#FFFFFF"}, "dark": {"primary": "#A9C4FF", "primary-hover": "#C0D3FF", "primary-active": "#91B3FF", "secondary": "#8ED5D8", "accent": "#FFB69E", "background": "#101827", "surface": "#172237", "surface-subtle": "#1E2C43", "text": "#F0F5FF", "text-secondary": "#C3D0E4", "text-muted": "#9EAFCA", "border": "#354660", "border-control": "#7187A8", "selected": "#253F69", "on-selected": "#DAE7FF", "focus": "#A9C4FF", "disabled": "#2C394F", "on-disabled": "#A6B4C9", "success": "#8DDAB0", "success-surface": "#173D30", "warning": "#F4D184", "warning-surface": "#40331D", "error": "#FFB2B8", "error-surface": "#48262F", "on-primary": "#102653"}}, {"id": "evergreen", "name": "Evergreen", "note": "Warm, grounded editorial character. Forest green and paper tones feel calm and personal.", "light": {"primary": "#22624C", "primary-hover": "#1B503E", "primary-active": "#143E30", "secondary": "#735334", "accent": "#866012", "background": "#F7F5EF", "surface": "#FFFEFA", "surface-subtle": "#EFEDE4", "text": "#20382F", "text-secondary": "#4D5F54", "text-muted": "#5E6A5B", "border": "#DDDCD1", "border-control": "#7B887B", "selected": "#E3EFE6", "on-selected": "#214D38", "focus": "#22624C", "disabled": "#E7E7DE", "on-disabled": "#6A7468", "success": "#276345", "success-surface": "#E4F1E6", "warning": "#7D540E", "warning-surface": "#FFF1D3", "error": "#A73535", "error-surface": "#FCECE9", "on-primary": "#FFFFFF"}, "dark": {"primary": "#A1D9B8", "primary-hover": "#B8E7CB", "primary-active": "#87CAA2", "secondary": "#DFC2A0", "accent": "#FFB59B", "background": "#131C18", "surface": "#1C2922", "surface-subtle": "#26362D", "text": "#F1F5EA", "text-secondary": "#CBD7C8", "text-muted": "#A6B7A5", "border": "#3A4D40", "border-control": "#7A9580", "selected": "#294B37", "on-selected": "#D7F1DE", "focus": "#A1D9B8", "disabled": "#2E4034", "on-disabled": "#ACBDA9", "success": "#A1D9B8", "success-surface": "#234430", "warning": "#E9CD8B", "warning-surface": "#43371F", "error": "#FFB8B0", "error-surface": "#4A2926", "on-primary": "#153824"}}, {"id": "aubergine", "name": "Aubergine", "note": "Distinctive and premium. Plum and restrained copper give the audio product a rich identity.", "light": {"primary": "#7040A1", "primary-hover": "#5F348B", "primary-active": "#4E2975", "secondary": "#4C607E", "accent": "#9B4828", "background": "#F8F5FA", "surface": "#FFFFFF", "surface-subtle": "#F0EAF5", "text": "#30243B", "text-secondary": "#61516F", "text-muted": "#706179", "border": "#E4DCEB", "border-control": "#91809D", "selected": "#EFE3FA", "on-selected": "#5C2E86", "focus": "#7040A1", "disabled": "#EAE3EF", "on-disabled": "#796B82", "success": "#23634D", "success-surface": "#E6F4EC", "warning": "#815000", "warning-surface": "#FFF0D2", "error": "#AA304A", "error-surface": "#FCEAF0", "on-primary": "#FFFFFF"}, "dark": {"primary": "#D7B2F4", "primary-hover": "#E5C9FA", "primary-active": "#C597EA", "secondary": "#A8C9E8", "accent": "#F1B88F", "background": "#1B1423", "surface": "#281E33", "surface-subtle": "#34283F", "text": "#F7EEFF", "text-secondary": "#D8C7E5", "text-muted": "#B8A4C7", "border": "#51405F", "border-control": "#9982AC", "selected": "#4C315F", "on-selected": "#F0DDFF", "focus": "#D7B2F4", "disabled": "#403249", "on-disabled": "#C0ACC9", "success": "#9EDDC1", "success-surface": "#214335", "warning": "#EBCD8B", "warning-surface": "#463621", "error": "#FFB4C7", "error-surface": "#4E2535", "on-primary": "#331448"}}, {"id": "midnight", "name": "Midnight Studio", "note": "Audio-first and immersive. Slate, bright cyan and a restrained violet accent suit frequent listeners.", "light": {"primary": "#086579", "primary-hover": "#075364", "primary-active": "#064552", "secondary": "#4F46A2", "accent": "#6556B1", "background": "#F1F6F8", "surface": "#FFFFFF", "surface-subtle": "#E7F0F3", "text": "#172D38", "text-secondary": "#435E6A", "text-muted": "#566C77", "border": "#D3E0E6", "border-control": "#6E8996", "selected": "#DAEFF3", "on-selected": "#075667", "focus": "#086579", "disabled": "#DFE9ED", "on-disabled": "#637985", "success": "#176347", "success-surface": "#E2F3EB", "warning": "#805200", "warning-surface": "#FFF0D0", "error": "#AD3041", "error-surface": "#FDEBF0", "on-primary": "#FFFFFF"}, "dark": {"primary": "#75D8E8", "primary-hover": "#9CE8F3", "primary-active": "#56BED0", "secondary": "#B8ADF4", "accent": "#C4B5FD", "background": "#0F171D", "surface": "#17242D", "surface-subtle": "#20313D", "text": "#ECF6FA", "text-secondary": "#C2D8E1", "text-muted": "#9EB9C6", "border": "#344D5A", "border-control": "#6A95A8", "selected": "#163E4C", "on-selected": "#BAF0F6", "focus": "#75D8E8", "disabled": "#293F4B", "on-disabled": "#A3BBC6", "success": "#8CDAB4", "success-surface": "#193E30", "warning": "#F2D18E", "warning-surface": "#42351E", "error": "#FFB2BF", "error-surface": "#492833", "on-primary": "#063440"}}];
const icon={play:'<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2v12l10-6z"/></svg>',home:'◉',discover:'◇',podcast:'♫'};
function draw(){const mode=document.getElementById('mode').value;document.getElementById('proposals').innerHTML=palettes.map((p,i)=>{const t=p[mode],css=Object.entries(t).map(([k,v])=>'--'+k+':'+v).join(';');const wave=Array.from({length:58},(_,j)=>'<i class="'+(j<23?'played':'')+'" style="height:'+(5+Math.abs(Math.sin(j*.72)*Math.cos(j*.18))*23)+'px"></i>').join('');return `<section class="proposal"><h2>${i+1}. ${p.name}${p.recommend?' · Recommended':''}</h2><p>${p.note}</p><div class="demo" style="${css}"><div class="top"><b class="brand"><span>✳</span> Seranews</b><span class="avatar">MU</span></div><div class="content"><span class="eyebrow">YOUR DAILY PERSPECTIVE</span><h3>A little more perspective.</h3><div class="sub">The stories that matter. Made for you.</div><div class="hero"><span class="eyebrow">TODAY’S BRIEF</span><h4>The morning,<br>made yours.</h4><div class="meta">~5 min · English · Balanced</div><button class="primary">${icon.play} Play your briefing</button></div><div class="section-label">On your radar <span class="text-link">See all →</span></div><div class="article"><div class="art">N</div><div><div class="source">Invezz · Source-linked report</div><h5>The AI earnings story<br>everyone is watching</h5><span class="tag">Technology</span> <span class="tag">Markets</span></div></div><div class="prefs"><div><b>A briefing that fits you</b><small>Personalization updates instantly</small></div><span class="switch" aria-label="Personalization enabled"></span></div><div class="notice-row"><span class="notice ok">✓ Ready</span><span class="notice warn">! Queued</span><span class="notice err">× Try again</span></div></div><div class="player"><div class="player-top"><span>Your morning, in perspective<br><small>Chapter 2 of 4 · Natural voices</small></span><span style="color:var(--primary)">Ⅱ</span></div><div class="wave">${wave}</div><div class="clock"><span>1:42</span><span>4:25</span></div></div><div class="nav"><span class="active">${icon.home}<span>Today</span></span><span>${icon.discover}<span>Discover</span></span><span>${icon.podcast}<span>Podcasts</span></span></div></div><div class="state-samples demo" style="${css};padding:12px;border-radius:12px;box-shadow:none"><button class="primary">Hover / press</button><span class="selected-chip">✓ Selected</span><button class="primary" disabled>Unavailable</button></div><details><summary>Semantic colors and states · ${mode}</summary><table><thead><tr><th>Role</th><th>Color</th></tr></thead><tbody>${Object.entries(t).map(([k,v])=>'<tr><td>'+k+'</td><td><span class="sample-dot" style="background:'+v+'"></span>'+v+'</td></tr>').join('')}</tbody></table></details></section>`}).join('')}
document.getElementById('mode').addEventListener('change',draw);draw();</script></body></html>
